# /etc/nginx/conf.d/bodas.conf

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ------------------------------------------------------------------
    # LIMITES E BUFFERS
    # ------------------------------------------------------------------
    client_max_body_size 10M;
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    keepalive_timeout 60;
    send_timeout 30;

    server_tokens off;

    # URLs limpas: redireciona .html para versao sem extensao
    if ($uri ~ ^/(.+)\.html$) {
        return 301 /$1;
    }

    # ------------------------------------------------------------------
    # HEADERS DE SEGURANCA
    # ------------------------------------------------------------------
    # Content-Security-Policy unificada e compatível com o que o site usa:
    # - script  : próprio site + canvas-confetti (cdn.jsdelivr.net)
    # - style   : próprio + Font Awesome (cdnjs) + Google Fonts (fonts.googleapis.com)
    # - font    : Google Fonts (fonts.gstatic.com) + Font Awesome webfonts (cdnjs)
    # - frame   : Google Maps embed (www.google.com / maps.google.com)
    # - img     : próprio + https (imagens/tiles mapa) + data:
    # - connect : próprio (PocketBase /api/pb e Umami /a/t/api/send, ambos same-origin)
    # - worker  : blob: (confetti/canvas)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self' https://cdn.jsdelivr.net; media-src 'self'; worker-src blob:; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ------------------------------------------------------------------
    # COMPRESSAO GZIP
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ------------------------------------------------------------------
    # REGRAS DE BLOQUEIO (Scans / Path Traversal)
    # ------------------------------------------------------------------
    location ~ /\. {
        deny all;
    }

    location ~* \.(php|sql|bak|old|ini|conf|sh|env|cgi|log|swp|tmp)$ {
        deny all;
    }

    location ~* ^/(wp-admin|wp-includes|wp-content|vendor|phpunit|phpmyadmin|admin|staging|config|xmlrpc\.php|wp-login\.php)/ {
        deny all;
    }

    # ------------------------------------------------------------------
    # HTML / paginas: sempre revalida com o servidor
    # ------------------------------------------------------------------
    location / {
        limit_except GET HEAD POST {
            deny all;
        }
        try_files $uri $uri.html $uri/ =404;

        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # ------------------------------------------------------------------
    # JS/CSS: revalida com o servidor (If-Modified-Since/ETag).
    # 304 e quase instantanea; se mudou, o navegador baixa a versao nova.
    # ------------------------------------------------------------------
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache" always;
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Imagens/audio: cache imutavel durante 1 mes.
    # Ao trocar o conteudo, mude o nome do arquivo (versionamento).
    # ------------------------------------------------------------------
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|mp3|wav|ogg)$ {
        expires 1M;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Fontes: cache imutavel durante 1 ano.
    # ------------------------------------------------------------------
    location ~* \.(woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # PROXY REVERSO - PocketBase interno
    # O SDK do PocketBase adiciona /api/ automaticamente ao PB_URL.
    # PB_URL = '/api/pb'  ->  requests para /api/pb/api/collections/...
    # ------------------------------------------------------------------
    location /api/pb/api/ {
        limit_req zone=api_limit burst=30 nodelay;

        # Bloquear navegacao direta (colar URL no navegador)
        if ($http_sec_fetch_dest = document) {
            return 403;
        }

        # Aceitar apenas requisicoes do proprio site
        if ($http_referer !~ ^https?://(bodasmel\.com\.br|www\.bodasmel\.com\.br)/) {
            return 403;
        }

        # Permitir apenas GET e POST (leitura do mural e envios)
        limit_except GET POST {
            deny all;
        }

        proxy_pass http://websites_pocketbase:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Impedir cache de respostas da API
        add_header Cache-Control "no-store" always;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        proxy_buffers 4 32k;
        proxy_buffer_size 16k;
    }

    # ------------------------------------------------------------------
    # PROXY REVERSO - Umami Analytics (coleta de eventos)
    # ------------------------------------------------------------------
    location /a/t/api/send {
        proxy_pass http://n8n_umami:3000/api/send;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_except POST OPTIONS {
            deny all;
        }

        add_header Cache-Control "no-store" always;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
}
