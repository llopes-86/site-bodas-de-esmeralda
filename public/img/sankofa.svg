<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sankofaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8A45E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E8B57;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Corpo do Sankofa em arco -->
  <path d="M 75 70
           C 75 45, 60 25, 38 25
           C 22 25, 12 38, 12 52
           C 12 60, 16 67, 24 70
           L 20 78
           C 8 72, 2 62, 2 50
           C 2 30, 18 12, 40 12
           C 68 12, 88 38, 88 70
           C 88 78, 86 85, 82 90
           L 92 92
           L 92 98
           L 68 96
           L 72 88
           C 76 84, 78 77, 78 70
           Z"
        fill="url(#sankofaGradient)" stroke="#1a5233" stroke-width="1.5"/>
  <!-- Cabeça virada para trás -->
  <circle cx="30" cy="52" r="10" fill="#C8A45E" stroke="#1a5233" stroke-width="1.5"/>
  <!-- Bico -->
  <path d="M 22 48 L 10 45 L 14 52 Z" fill="#2E8B57" stroke="#1a5233" stroke-width="1"/>
  <!-- Olho -->
  <circle cx="28" cy="50" r="2.5" fill="#1a5233"/>
  <!-- Ovo no bico (representa o que se busca do passado) -->
